zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 18e6d704c777453d98a6835f393755ec
      name: 'Astra clients'
  templates:
    - uuid: 080bf8fe907c48669d5c663475c52fcb
      template: 'Template Astra Linux Audit'
      name: 'Template Astra Linux Audit'
      description: 'Security event monitoring based on the Astra Linux audit log.'
      groups:
        - name: 'Astra clients'
      items:
        - uuid: 3ff17b8d5eb741eea3d35944451f6e97
          name: 'Audit: failed authentication events count'
          type: ZABBIX_ACTIVE
          key: 'logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USER_AUTH|USER_LOGIN).*res=failed","UTF-8",1000,skip]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          description: 'Number of new failed USER_AUTH or USER_LOGIN records found in the audit log during the item update interval.'
          tags:
            - tag: scope
              value: security
            - tag: component
              value: audit
            - tag: control
              value: event
          triggers:
            - uuid: c8140bd0626e43a1a8a9eda1ad5875c1
              expression: 'sum(/Template Astra Linux Audit/logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USER_AUTH|USER_LOGIN).*res=failed","UTF-8",1000,skip],{$AUDIT.AUTH.FAIL.WINDOW})>={$AUDIT.AUTH.FAIL.WARN} and sum(/Template Astra Linux Audit/logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USER_AUTH|USER_LOGIN).*res=failed","UTF-8",1000,skip],{$AUDIT.AUTH.FAIL.WINDOW})<{$AUDIT.AUTH.FAIL.HIGH}'
              name: 'Audit: repeated failed authentication attempts'
              opdata: 'Failed records in the latest item interval: {ITEM.LASTVALUE}'
              priority: WARNING
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: audit
                - tag: control
                  value: event
            - uuid: 9f37a256182f49278d0382614a659277
              expression: 'sum(/Template Astra Linux Audit/logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USER_AUTH|USER_LOGIN).*res=failed","UTF-8",1000,skip],{$AUDIT.AUTH.FAIL.WINDOW})>={$AUDIT.AUTH.FAIL.HIGH}'
              name: 'Audit: excessive failed authentication attempts'
              opdata: 'Failed records in the latest item interval: {ITEM.LASTVALUE}'
              priority: HIGH
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: audit
                - tag: control
                  value: event
      macros:
        - macro: '{$AUDIT.AUTH.FAIL.WARN}'
          value: '5'
          description: 'Number of failed authentication audit records that raises a warning.'
        - macro: '{$AUDIT.AUTH.FAIL.HIGH}'
          value: '10'
          description: 'Number of failed authentication audit records that raises a high-severity problem.'
        - macro: '{$AUDIT.AUTH.FAIL.WINDOW}'
          value: 5m
          description: 'Time window used to count failed authentication audit records.'
