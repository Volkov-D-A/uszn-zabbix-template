zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 18e6d704c777453d98a6835f393755ec
      name: 'Astra clients'
  templates:
    - uuid: 080bf8fe907c48669d5c663475c52fcb
      template: 'Template Astra Linux Audit'
      name: 'Astra Linux: аудит безопасности'
      description: 'Мониторинг событий безопасности на основе журнала аудита Astra Linux.'
      groups:
        - name: 'Astra clients'
      items:
        - uuid: 88528829b077496a9e6470f1a048225f
          name: 'Аудит: события изменения конфигурации безопасности'
          type: ZABBIX_ACTIVE
          key: 'logrt["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USYS_CONFIG|DAEMON_CONFIG|CONFIG_CHANGE|MAC_CONFIG_CHANGE|USER_MAC_CONFIG_CHANGE)","UTF-8",1000,skip]'
          delay: 30s
          history: 30d
          trends: '0'
          value_type: LOG
          description: 'Исходные записи об изменении конфигурации подсистем безопасности для анализа инициатора и характера изменения.'
          tags:
            - tag: scope
              value: security
            - tag: component
              value: audit
            - tag: control
              value: event
          triggers:
            - uuid: bc5379e50d7342bebac906e29a20845b
              expression: 'find(/Template Astra Linux Audit/logrt["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USYS_CONFIG|DAEMON_CONFIG|CONFIG_CHANGE|MAC_CONFIG_CHANGE|USER_MAC_CONFIG_CHANGE)","UTF-8",1000,skip],,"regexp","^(?!(?=.*type=CONFIG_CHANGE)(?=.*auid=4294967295)(?=.*res=1([[:space:]]|$))(?=.*(op=add_rule|op=set audit_(backlog_limit|backlog_wait_time|failure)=))).*type=(USYS_CONFIG|DAEMON_CONFIG|CONFIG_CHANGE|MAC_CONFIG_CHANGE|USER_MAC_CONFIG_CHANGE)")=1'
              name: 'Аудит: обнаружено изменение конфигурации безопасности'
              opdata: 'Событие: {{ITEM.VALUE}.regsub("(.*)", \1)}'
              priority: INFO
              description: 'Обнаружено изменение конфигурации подсистем безопасности, не отнесенное к подтвержденной штатной загрузке auditd. Проверьте исходную строку в оперативных данных, определите инициатора и характер изменения, затем закройте проблему вручную. Остальные строки этой серии доступны в истории элемента данных.'
              type: SINGLE
              recovery_mode: NONE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: audit
                - tag: control
                  value: event
        - uuid: f61b54a50bf549f18d62601b8056bcbc
          name: 'Аудит: количество ошибок службы auditd'
          type: ZABBIX_ACTIVE
          key: 'logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(DAEMON_ABORT|DAEMON_ERR)","UTF-8",1000,skip]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          description: 'Количество новых записей DAEMON_ABORT или DAEMON_ERR, обнаруженных в журнале аудита за интервал опроса.'
          tags:
            - tag: scope
              value: security
            - tag: component
              value: audit
            - tag: control
              value: event
          triggers:
            - uuid: a6ac6b543afc4c09a5e3d94170618583
              expression: 'last(/Template Astra Linux Audit/logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(DAEMON_ABORT|DAEMON_ERR)","UTF-8",1000,skip])>0'
              name: 'Аудит: обнаружена ошибка службы auditd'
              opdata: 'Ошибок за последний интервал: {ITEM.LASTVALUE}'
              priority: HIGH
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: audit
                - tag: control
                  value: event
        - uuid: 3ff17b8d5eb741eea3d35944451f6e97
          name: 'Аудит: количество ошибок аутентификации'
          type: ZABBIX_ACTIVE
          key: 'logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USER_AUTH|USER_LOGIN).*res=failed","UTF-8",1000,skip]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          description: 'Количество новых записей USER_AUTH или USER_LOGIN с результатом res=failed, обнаруженных в журнале аудита за интервал опроса.'
          tags:
            - tag: scope
              value: security
            - tag: component
              value: audit
            - tag: control
              value: event
          triggers:
            - uuid: c8140bd0626e43a1a8a9eda1ad5875c1
              expression: 'sum(/Template Astra Linux Audit/logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USER_AUTH|USER_LOGIN).*res=failed","UTF-8",1000,skip],{$AUDIT.AUTH.FAIL.WINDOW})>={$AUDIT.AUTH.FAIL.WARN} and sum(/Template Astra Linux Audit/logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USER_AUTH|USER_LOGIN).*res=failed","UTF-8",1000,skip],{$AUDIT.AUTH.FAIL.WINDOW})<{$AUDIT.AUTH.FAIL.HIGH}'
              name: 'Аудит: повторные ошибки аутентификации'
              opdata: 'Ошибок за последний интервал: {ITEM.LASTVALUE}'
              priority: WARNING
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: audit
                - tag: control
                  value: event
            - uuid: 9f37a256182f49278d0382614a659277
              expression: 'sum(/Template Astra Linux Audit/logrt.count["/var/log/audit/^audit\.log(\.[0-9]+)?$","type=(USER_AUTH|USER_LOGIN).*res=failed","UTF-8",1000,skip],{$AUDIT.AUTH.FAIL.WINDOW})>={$AUDIT.AUTH.FAIL.HIGH}'
              name: 'Аудит: критическое количество ошибок аутентификации'
              opdata: 'Ошибок за последний интервал: {ITEM.LASTVALUE}'
              priority: HIGH
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: audit
                - tag: control
                  value: event
      macros:
        - macro: '{$AUDIT.AUTH.FAIL.WARN}'
          value: '5'
          description: 'Количество записей о неудачной аутентификации для создания предупреждения.'
        - macro: '{$AUDIT.AUTH.FAIL.HIGH}'
          value: '10'
          description: 'Количество записей о неудачной аутентификации для создания проблемы высокой важности.'
        - macro: '{$AUDIT.AUTH.FAIL.WINDOW}'
          value: 5m
          description: 'Интервал времени для подсчета записей о неудачной аутентификации.'
