zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 18e6d704c777453d98a6835f393755ec
      name: 'Astra clients'
  host_groups:
    - uuid: 4c469bc127d64a34ba625f7f4244153f
      name: 'Astra clients'
  templates:
    - uuid: 2696cbf6209f45ea8ed58da2082a099c
      template: 'Template Astra Linux Basic'
      name: 'Astra Linux: базовый контроль безопасности'
      description: 'Базовый контроль версии ОС, ядра и состояния служб безопасности Astra Linux.'
      groups:
        - name: 'Astra clients'
      items:
        - uuid: 7367c5f8babb479f9b7116bda079f31f
          name: 'Astra Linux: версия сборки'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/etc/astra_version]'
          delay: 1h
          history: 90d
          trends: '0'
          value_type: TEXT
          tags:
            - tag: scope
              value: security
            - tag: component
              value: os
            - tag: control
              value: inventory
          triggers:
            - uuid: 34ea47e8691d4673b14b02713757cce5
              expression: 'change(/Template Astra Linux Basic/vfs.file.contents[/etc/astra_version])=1'
              name: 'Astra Linux: изменилась версия сборки'
              opdata: 'Текущая версия: {ITEM.LASTVALUE}'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: os
                - tag: control
                  value: inventory
        - uuid: 8ac3ee7699ce4ab2bef493a721f99c14
          name: 'Linux: версия ядра'
          type: ZABBIX_ACTIVE
          key: 'system.sw.os[full]'
          delay: 1h
          history: 90d
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: REGEX
              parameters:
                - '^Linux version (\S+).*'
                - '\1'
          tags:
            - tag: scope
              value: security
            - tag: component
              value: os
            - tag: control
              value: inventory
          triggers:
            - uuid: 1daf688f924b4aeaacb978142f929a28
              expression: 'change(/Template Astra Linux Basic/system.sw.os[full])=1'
              name: 'Linux: изменилась версия ядра'
              opdata: 'Текущая версия: {ITEM.LASTVALUE}'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: os
                - tag: control
                  value: inventory
        - uuid: 9dd4ed1da70447d7892e70fa31143de3
          name: 'Dr.Web: состояние службы конфигурации'
          type: ZABBIX_ACTIVE
          key: 'systemd.unit.info[drweb-configd.service,ActiveState]'
          delay: 1m
          history: 30d
          trends: '0'
          value_type: CHAR
          tags:
            - tag: scope
              value: security
            - tag: component
              value: drweb
            - tag: control
              value: availability
          triggers:
            - uuid: e63a2a31391644708d0577f00a2d477a
              expression: 'last(/Template Astra Linux Basic/systemd.unit.info[drweb-configd.service,ActiveState])<>"active"'
              name: 'Dr.Web: служба конфигурации не активна'
              opdata: 'Текущее состояние: {ITEM.LASTVALUE}'
              priority: HIGH
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: drweb
                - tag: control
                  value: availability
        - uuid: 7aa4d0cfc9dc49d8aac440089a00c66a
          name: 'Аудит: состояние службы auditd'
          type: ZABBIX_ACTIVE
          key: 'systemd.unit.info[auditd.service,ActiveState]'
          delay: 1m
          history: 30d
          trends: '0'
          value_type: CHAR
          tags:
            - tag: scope
              value: security
            - tag: component
              value: audit
            - tag: control
              value: availability
          triggers:
            - uuid: 480f7d434e3043529ee51b7f6697773e
              expression: 'last(/Template Astra Linux Basic/systemd.unit.info[auditd.service,ActiveState])<>"active"'
              name: 'Аудит: служба auditd не активна'
              opdata: 'Текущее состояние: {ITEM.LASTVALUE}'
              priority: HIGH
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: audit
                - tag: control
                  value: availability
        - uuid: 408dc5e524874e149ba8f53f537da7de
          name: 'Синхронизация времени: состояние службы systemd-timesyncd'
          type: ZABBIX_ACTIVE
          key: 'systemd.unit.info[systemd-timesyncd.service,ActiveState]'
          delay: 1m
          history: 30d
          trends: '0'
          value_type: CHAR
          tags:
            - tag: scope
              value: security
            - tag: component
              value: time
            - tag: control
              value: availability
          triggers:
            - uuid: 6d62336364f54ca49960b202d270c220
              expression: 'last(/Template Astra Linux Basic/systemd.unit.info[systemd-timesyncd.service,ActiveState])<>"active"'
              name: 'Синхронизация времени: служба systemd-timesyncd не активна'
              opdata: 'Текущее состояние: {ITEM.LASTVALUE}'
              priority: WARNING
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: time
                - tag: control
                  value: availability
        - uuid: c20a4246a6f8462b9c68fe03daf3a28d
          name: 'Обновления: состояние службы astra-update-service'
          type: ZABBIX_ACTIVE
          key: 'systemd.unit.info[astra-update-service.service,ActiveState]'
          delay: 1m
          history: 30d
          trends: '0'
          value_type: CHAR
          tags:
            - tag: scope
              value: security
            - tag: component
              value: updates
            - tag: control
              value: availability
          triggers:
            - uuid: 387e7d1c25c545b9b3ed966c97ac417a
              expression: 'last(/Template Astra Linux Basic/systemd.unit.info[astra-update-service.service,ActiveState])<>"active"'
              name: 'Обновления: служба astra-update-service не активна'
              opdata: 'Текущее состояние: {ITEM.LASTVALUE}'
              priority: WARNING
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: updates
                - tag: control
                  value: availability
        - uuid: 220dcff3c3c84ee69275509df000ab2c
          name: 'Dr.Web: время изменения файла актуальной базы'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.time[/var/opt/drweb.com/bases/dwrtoday.vdb,modify]'
          delay: 1h
          history: 90d
          trends: 365d
          value_type: UNSIGNED
          units: unixtime
          tags:
            - tag: scope
              value: security
            - tag: component
              value: drweb
            - tag: control
              value: freshness
          triggers:
            - uuid: 7c797227da5e49428c889b10dd80bd3e
              expression: 'now()-last(/Template Astra Linux Basic/vfs.file.time[/var/opt/drweb.com/bases/dwrtoday.vdb,modify])>{$DRWEB.BASES.MAXAGE} and nodata(/Template Astra Linux Basic/vfs.file.time[/var/opt/drweb.com/bases/dwrtoday.vdb,modify],{$DRWEB.BASES.NODATA})=0'
              name: 'Dr.Web: файл актуальной базы давно не обновлялся'
              opdata: 'Время изменения файла: {ITEM.LASTVALUE}'
              priority: WARNING
              tags:
                - tag: scope
                  value: security
                - tag: component
                  value: drweb
                - tag: control
                  value: freshness
      macros:
        - macro: '{$DRWEB.BASES.MAXAGE}'
          value: 2d
          description: 'Максимально допустимый возраст времени изменения файла актуальной базы Dr.Web.'
        - macro: '{$DRWEB.BASES.NODATA}'
          value: 2h
          description: 'Допустимое время отсутствия данных о файле базы Dr.Web, при котором подавляется триггер устаревшей базы.'
